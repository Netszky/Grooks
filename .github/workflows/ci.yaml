name: CI

on:
  pull_request:            # à chaque pull request
  push:
    branches: [main]       # et à chaque fusion dans main

permissions:
  contents: read           # la CI ne fait que lire le code : le minimum de droits

concurrency:               # si tu pousses deux fois de suite sur la même branche,
  group: ci-${{ github.ref }}   # la première exécution est annulée
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest   # Docker y est installé : Testcontainers fonctionne directement

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven       # garde les dépendances Maven entre deux exécutions

      - name: Build et tests
        run: ./mvnw -B verify