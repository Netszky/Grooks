spring:
  application:
    name: grooks
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grooks}
    username: ${DB_USER:grooks}
    password: ${DB_PASSWORD:grooks}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  config:
    import: optional:file:.env[.properties]
grooks:
  jwt:
    secret: ${JWT_SECRET}
    duration: ${JWT_DURATION:1h}
