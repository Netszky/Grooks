services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: grooks
      POSTGRES_USER: ${DB_USER:-grooks}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-grooks}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d grooks" ]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data: